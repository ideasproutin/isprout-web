version: 1
frontend:
    phases:
        preBuild:
            commands:
                - npm ci
                # Install Chromium system dependencies for Puppeteer
                - yum install -y chromium || apt-get install -y chromium-browser || true
        build:
            commands:
                - npm run build
    artifacts:
        baseDirectory: dist
        files:
            - "**/*"
    cache:
        paths:
            - node_modules/**/*
    customRules:
        # Serve static assets (JS, CSS, images, fonts, etc.) directly
        - source: "/assets/<*>"
          target: "/assets/<*>"
          status: "200"
        # Rewrite all other paths to index.html for SPA routing (handles trailing slashes too)
        - source: "/<*>"
          target: "/index.html"
          status: "200"
