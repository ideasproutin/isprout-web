      var loaded = false;

      function injectScript(src, id) {
        if (id && document.getElementById(id)) return;
        var s = document.createElement('script');
        if (id) s.id = id;
        s.async = true;
        s.src = src;
        var firstScript = document.getElementsByTagName('script')[0];
        firstScript.parentNode.insertBefore(s, firstScript);
      }

      function injectStylesheet(href, id) {
        if (id && document.getElementById(id)) return;
        var l = document.createElement('link');
        if (id) l.id = id;
        l.rel = 'stylesheet';
        l.href = href;
        document.head.appendChild(l);
      }

      function cleanupListeners() {
        var opts = { passive: true };
        window.removeEventListener('pointerdown', loadThirdParty, opts);
        window.removeEventListener('keydown', loadThirdParty, opts);
        window.removeEventListener('touchstart', loadThirdParty, opts);
        window.removeEventListener('scroll', loadThirdParty, opts);
      }

      function loadThirdParty() {
        if (loaded) return;
        loaded = true;

        injectStylesheet('https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css', 'boxicons-css');
        injectScript('https://www.googletagmanager.com/gtag/js?id=' + gtagId, 'gtag-js');

        window.dataLayer.push({
          'gtm.start': new Date().getTime(),
          event: 'gtm.js'
        });
        injectScript('https://www.googletagmanager.com/gtm.js?id=' + gtmId, 'gtm-js');

        window.clarity = window.clarity || function () {
          (window.clarity.q = window.clarity.q || []).push(arguments);
        };
        injectScript('https://www.clarity.ms/tag/' + clarityId, 'clarity-js');

        window.$zoho = window.$zoho || {};
        window.$zoho.salesiq = window.$zoho.salesiq || {
          widgetcode: zohoWidgetCode,
          values: {},
          ready: function () { }
        };
        injectScript('https://salesiq.zoho.in/widget', 'zsiqscript');

        cleanupListeners();
      }

      var listenerOptions = { passive: true };
      window.addEventListener('pointerdown', loadThirdParty, listenerOptions);
      window.addEventListener('keydown', loadThirdParty, listenerOptions);
      window.addEventListener('touchstart', loadThirdParty, listenerOptions);
      window.addEventListener('scroll', loadThirdParty, listenerOptions);

      // Intentionally no auto-idle load: defer 3rd-party scripts until user intent
      // to keep initial main-thread work low for landing page performance.
    })();
  </script>
